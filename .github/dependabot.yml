version: 2
updates:
  # Keeps the SHA-pinned GitHub Actions current. Language ecosystems are added by /add-language.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7   # don't adopt a release until it has been out a week (supply-chain safety)
    groups:
      actions:
        patterns: ["*"]

  # Python: the uv workspace (ADR-0020).
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]

  # Node dev tools at the root: the Mermaid CLI for the level-N.md render test (plan 0002, T15).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      node-dev-tools:
        patterns: ["*"]
