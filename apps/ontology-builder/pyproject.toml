[project]
name = "ontology-builder"
version = "0.1.0"
description = "Builds leveled ontologies from Markdown corpora and user statements (spec 0002)."
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==2.12.0",
    "fastapi==0.165.0",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "markdown-it-py==4.3.0",
    "pydantic==2.14.3",
    "pyyaml==6.0.4",
    "rdflib==7.6.0",
    "typer==0.28.0",
    "uvicorn==0.54.0",
]

[project.scripts]
ontology-builder = "ontology_builder.cli:main"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
