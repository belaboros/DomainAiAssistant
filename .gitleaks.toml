# gitleaks configuration (ADR-0008): the default ruleset, plus project-specific allowlists.
# Only add an allowlist entry for a confirmed false positive, with a comment saying why.
[extend]
useDefault = true

# Confirmed false positive: the curated LLM fixtures of ontology-builder (spec 0002) give each
# candidate a short "key" such as "s.puppy-mother-8w" (type letter, dot, slug), which the
# generic-api-key rule mistakes for a secret. Only this key shape in those fixtures is allowed.
[[allowlists]]
description = "ontology-builder LLM fixture candidate keys"
targetRules = ["generic-api-key"]
paths = ['''^apps/ontology-builder/tests/fixtures/llm/[0-9a-f]{64}\.json$''']
regexTarget = "line"
regexes = ['''"key": "[a-z]{1,3}\.[a-z0-9][a-z0-9.-]*"''']
condition = "AND"

# Confirmed false positive: saved sessions (docs/sessions/) quote that same fixture key shape,
# e.g. `"key": "s.puppy-mother-8w"`, when they describe the allowlist above.
[[allowlists]]
description = "fixture candidate keys quoted in saved sessions"
targetRules = ["generic-api-key"]
paths = ['''^docs/sessions/[0-9]{8}-[0-9]{6}-[0-9a-f]{8}\.md$''']
regexTarget = "line"
regexes = ['''"key": "[a-z]{1,3}\.[a-z0-9][a-z0-9.-]*"''']
condition = "AND"
