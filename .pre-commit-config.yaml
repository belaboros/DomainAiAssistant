# Local quality and security gate (ADR-0008). Install once: `pre-commit install`.
# Update hook versions with `pre-commit autoupdate` (and review the diff).
repos:
  # Secrets: block any commit that contains a credential (also covers docs/sessions/).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks-system        # uses the installed binary: `brew install gitleaks`
        pass_filenames: false      # it scans the staged diff itself

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-json
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  # Shell scripts (hooks and tools) are code too.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # GitHub Actions security: unpinned actions, template injection, excessive permissions, etc.
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.32.0
    hooks:
      - id: zizmor
        args: ["--no-progress", "--offline"]  # no GitHub API calls at commit time, even when GH_TOKEN is set

  # Monorepo rules (ADR-0010, ADR-0013): apps never depend on each other, one writer per dataset,
  # every app and contract folder registered, and the generated system map up to date. Needs jq.
  - repo: local
    hooks:
      - id: system-map
        name: system map (components.json, apps/, libs/, architecture.md)
        entry: tools/monorepo/system-map.sh --check
        language: script
        pass_filenames: false
        files: ^(docs/architecture/|apps/|libs/)

  # Python quality gate (ADR-0020). Every hook runs through uv on the workspace in uv.lock.
  - repo: local
    hooks:
      - id: ruff
        name: ruff (lint, complexity, security rules)
        entry: uv run --quiet ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --quiet ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        entry: uv run --quiet mypy
        language: system
        pass_filenames: false
        types_or: [python, pyi]
      - id: python-cc-report
        name: python complexity report (warns at CC 11-15, fails above 15)
        entry: uv run --quiet python tools/quality/python/cc_report.py
        language: system
        pass_filenames: false
        verbose: true
        types_or: [python, pyi]
      - id: importlinter-config
        name: .importlinter matches components.json
        entry: uv run --quiet python tools/quality/python/gen_importlinter.py --check
        language: system
        pass_filenames: false
        files: (\.py|components\.json|\.importlinter)$
      - id: lint-imports
        name: import-linter (boundaries from components.json)
        entry: tools/quality/python/lint-imports.sh
        language: system
        pass_filenames: false
        files: (\.py|components\.json|\.importlinter)$
      - id: python-boundaries
        name: python boundaries (public entry points, cycles, app -> app)
        entry: uv run --quiet python tools/quality/python/boundaries.py
        language: system
        pass_filenames: false
        files: (\.py|components\.json)$
      - id: pytest
        name: pytest
        entry: uv run --quiet pytest -q
        language: system
        pass_filenames: false
        files: (\.py|\.ya?ml|\.json|\.md|pyproject\.toml|uv\.lock)$
      - id: pip-audit
        name: pip-audit (locked Python dependencies)
        entry: tools/quality/python/audit.sh
        language: system
        pass_filenames: false
        files: (pyproject\.toml|uv\.lock)$

  # JS/TS quality gate (ADR-0021). Every hook uses the npm workspace's locked tools (`npm ci`).
  - repo: local
    hooks:
      - id: prettier
        name: prettier (JS/TS formatting)
        entry: node_modules/.bin/prettier --check
        language: system
        files: \.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$
      - id: eslint
        name: eslint (lint, complexity, security rules)
        entry: node_modules/.bin/eslint --max-warnings 0 --no-warn-ignored
        language: system
        files: \.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$
      - id: tsc
        name: tsc (strict type check of every workspace)
        entry: npm run --silent typecheck
        language: system
        pass_filenames: false
        files: (\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)|tsconfig[^/]*\.json)$
      - id: js-ts-cc-report
        name: js/ts complexity report (warns at CC 11-15, fails above 15)
        entry: node tools/quality/js-ts/cc_report.ts
        language: system
        pass_filenames: false
        verbose: true
        files: \.(js|jsx|mjs|cjs|ts|tsx|mts|cts)$
      - id: depcruise-config
        name: .dependency-cruiser.json matches components.json
        entry: node tools/quality/js-ts/gen_depcruise.ts --check
        language: system
        pass_filenames: false
        files: (\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)|components\.json|\.dependency-cruiser\.json)$
      - id: depcruise
        name: dependency-cruiser (boundaries from components.json, cycles)
        entry: node_modules/.bin/depcruise --config .dependency-cruiser.json apps libs tools
        language: system
        pass_filenames: false
        files: (\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)|components\.json|\.dependency-cruiser\.json|package\.json)$
      - id: js-ts-boundaries
        name: js/ts boundaries (component cycles, public entry points, app -> app)
        entry: node tools/quality/js-ts/boundaries.ts
        language: system
        pass_filenames: false
        files: (\.(js|jsx|mjs|cjs|ts|tsx|mts|cts)|components\.json)$
      - id: vitest
        name: vitest (every workspace)
        entry: npm test --silent
        language: system
        pass_filenames: false
        files: (\.(js|jsx|mjs|cjs|ts|tsx|mts|cts|json))$
      - id: npm-audit
        name: npm audit (locked JS/TS dependencies)
        entry: tools/quality/js-ts/audit.sh
        language: system
        pass_filenames: false
        files: (package\.json|package-lock\.json)$
