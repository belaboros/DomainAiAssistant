    - 1. Scope and Definitions
    index_in_section: 2
    line_end: 8
    line_start: 8
    path: 01-scope-and-definitions.md
  text: 'These rules apply to buildings A, B and C around the shared inner yard. A **resident** is anyone who lives in one of the buildings: tenants, owners and their household members. The **house management** administers the buildings and enforces these rules. Every resident must follow them.'
