    status: proposed
  kind: paragraph
  location:
    heading_path:
    - 1. Scope and Definitions
    index_in_section: 1
    line_end: 6
    line_start: 6
    path: 01-scope-and-definitions.md
  text: 'More than two thousand years ago, Cicero wrote that the good of the community should guide every law. The same idea holds in a house where dozens of families share walls, stairs and a yard. Most of the time, what is good for all of us is also good for each of us: quiet nights, clean stairwells and safe escape routes help everyone. Sometimes it means giving up a little, such as a late party or a few minutes of convenience, so that a neighbour can sleep or pass safely. Nobody is asked to forget their own needs; we only ask that, in most cases, the shared interest comes first. If we treat each other with patience and good will, we can live together in harmony, as good neighbours and agreeable people.'
- content_hash: sha256:aa560e6e6dda1449071c907220051c7583bc052f6956a57d8a9c36ba0d0517c7
  document_id: doc_01M82H6T2RFZXKEGGF51P3J7NM
