    line_start: 3
    path: 09-moving-house-with-a-cat.md
  text: Cats are attached to their territory. On moving day, keep the cat in a closed room with its litter box. After the move, keep an outdoor cat indoors for at least 2 weeks before you let it outside, so that it learns its new home.
