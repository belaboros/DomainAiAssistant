  kind: list_item
  location:
    heading_path:
    - 2. Indoor or Outdoor Cat
    index_in_section: 1
    line_end: 5
    line_start: 5
    path: 02-indoor-or-outdoor-cat.md
  text: An **indoor cat** never leaves the flat. On average it lives longer, but it needs more play and climbing places.
- content_hash: sha256:54c5a80b6ca8d477a5ac2375173716baa44cff1ccb739758f8618551a222d3d7
  document_id: doc_01M82GXF5BZJDB4QGXVFMJEB2Y
  id: su_01M82GXF5BZJDB4QGXVFMJEB31
  kind: list_item
  location:
    heading_path:
    - 2. Indoor or Outdoor Cat
    index_in_section: 2
    line_end: 6
    line_start: 6
    path: 02-indoor-or-outdoor-cat.md
  text: An **outdoor cat** goes outside on its own. It must be vaccinated and microchipped before it goes outside for the first time.
