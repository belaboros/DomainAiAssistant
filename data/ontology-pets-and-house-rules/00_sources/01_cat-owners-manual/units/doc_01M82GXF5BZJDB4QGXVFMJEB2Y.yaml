    path: 02-indoor-or-outdoor-cat.md
  text: Decide early whether your cat will be an indoor cat or an outdoor cat.
- content_hash: sha256:1c5e367d2b6ea96a256094eb35aa17805fefe8ac35d6942d23b6ac2d88c44ef0
  document_id: doc_01M82GXF5BZJDB4QGXVFMJEB2Y
