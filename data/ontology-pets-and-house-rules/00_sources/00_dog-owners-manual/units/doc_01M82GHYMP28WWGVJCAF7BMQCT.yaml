    path: 03-health-and-care/03-grooming-and-hygiene.md
  text: Brush your dog at least once a week; long-haired breeds need brushing every day. Trim the claws when you can hear them clicking on the floor. Wash your dog's bed and blankets once a week at 60 °C.
