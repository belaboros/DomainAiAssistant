    path: 01-before-you-get-a-dog.md
  text: I still remember the rainy October evening when I brought Bodza home from the shelter in Szentendre, a shy, mud-coloured mix with one ear that never stood up. For the first three nights she slept pressed against the door, as if she expected someone to come and take her back. On the fourth morning she climbed onto the end of my bed, sighed, and stayed there for the next thirteen years. Together we walked the same path along the Danube almost every day, whatever the weather, and she knew every bench where an old lady kept biscuits in her pocket. She taught me patience long before I taught her to sit. When she grew old and grey around the muzzle, our walks became shorter, but she never once let me leave the house without her. Everything in this manual is something I learned, often the hard way, by her side.
