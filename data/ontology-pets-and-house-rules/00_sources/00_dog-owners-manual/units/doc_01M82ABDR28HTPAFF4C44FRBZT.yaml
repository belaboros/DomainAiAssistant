    - 8. Leaving Your Dog Alone
    index_in_section: 1
    line_end: 5
    line_start: 5
    path: 08-leaving-your-dog-alone.md
  text: Before you leave, walk the dog, leave water and a safe chew toy, and keep your departure low-key. If your dog barks or howls while you are away, train it to be alone step by step, starting with a few minutes.
