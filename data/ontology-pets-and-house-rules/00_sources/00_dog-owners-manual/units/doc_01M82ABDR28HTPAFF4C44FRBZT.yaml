    path: 08-leaving-your-dog-alone.md
  text: Dogs are social animals. **Never leave an adult dog alone at home for more than 6 hours.** Puppies should not be left alone for more than 2 hours.
- content_hash: sha256:a683b469368559bec13671f5140eb9d665091dfc94a6152a4b79988660449445
  document_id: doc_01M82ABDR28HTPAFF4C44FRBZT
