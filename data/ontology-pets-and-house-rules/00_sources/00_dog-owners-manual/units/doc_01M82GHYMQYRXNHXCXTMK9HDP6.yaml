    - 6. Being a Good Lead for Your Dog
    index_in_section: 0
    line_end: 3
    line_start: 3
    path: 06-being-a-good-lead-for-your-dog.md
  text: 'Your dog looks to you for direction. Be its lead: a calm, consistent and confident leader whose signals it can trust.'
- content_hash: sha256:4816ad4b0dc81fb1b8e3fc5c32673e5e0ef43f5a4266277091270ae9550fac29
  document_id: doc_01M82GHYMQYRXNHXCXTMK9HDP6
  id: su_01M82GHYMQYRXNHXCXTMK9HDP8
  kind: list_item
  location:
    heading_path:
    - 6. Being a Good Lead for Your Dog
    index_in_section: 1
    line_end: 5
    line_start: 5
    path: 06-being-a-good-lead-for-your-dog.md
  text: Use the same command words every time, and make sure everyone in the family uses them too.
- content_hash: sha256:fc01fe257c9d245239e4846e4836aaf21d6b48b8ccbaa9f4a6573d0f4f25f87c
  document_id: doc_01M82GHYMQYRXNHXCXTMK9HDP6
  id: su_01M82GHYMQYRXNHXCXTMK9HDP9
  kind: list_item
  location:
    heading_path:
    - 6. Being a Good Lead for Your Dog
    index_in_section: 2
    line_end: 6
    line_start: 6
    path: 06-being-a-good-lead-for-your-dog.md
  text: Set clear rules (for example, whether the dog may lie on the sofa) and keep them.
- content_hash: sha256:62bc74433582d7c89ce9c1c6a3e7142dfbddec17808e280cbc6821209bb76b42
  document_id: doc_01M82GHYMQYRXNHXCXTMK9HDP6
  id: su_01M82GHYMQYRXNHXCXTMK9HDPA
  kind: list_item
  location:
    heading_path:
    - 6. Being a Good Lead for Your Dog
    index_in_section: 3
    line_end: 7
    line_start: 7
    path: 06-being-a-good-lead-for-your-dog.md
  text: Reward good behaviour immediately; ignore unwanted behaviour instead of shouting.
- content_hash: sha256:808a7cea660806a4ef789d0c4858bf0795b2677f0e316bfdbadfd9ac8a797831
  document_id: doc_01M82GHYMQYRXNHXCXTMK9HDP6
  id: su_01M82GHYMQYRXNHXCXTMK9HDPB
  kind: paragraph
  location:
    heading_path:
    - 6. Being a Good Lead for Your Dog
    index_in_section: 4
    line_end: 9
    line_start: 9
    path: 06-being-a-good-lead-for-your-dog.md
  text: A dog that does not see its owner as a reliable lead may become anxious or try to take control.
