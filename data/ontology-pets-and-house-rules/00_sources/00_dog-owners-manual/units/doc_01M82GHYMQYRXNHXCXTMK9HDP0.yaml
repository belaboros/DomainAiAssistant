    path: 05-walking-and-the-leash/01-choosing-a-leash.md
  text: 'Use a leash of 1.5 to 2 metres for everyday walks. A retractable leash is not suitable in busy streets. Attach the leash to a well-fitting collar or harness: you should be able to slide two fingers under the collar.'
