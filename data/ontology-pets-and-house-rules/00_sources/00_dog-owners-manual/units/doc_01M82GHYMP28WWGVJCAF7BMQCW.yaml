    index_in_section: 1
    line_end: 5
    line_start: 5
    path: 04-puppy-basics.md
  text: 'House training starts on the first day: take the puppy outside after every meal, after every nap and after play, and praise it when it relieves itself outside. Between 8 and 16 weeks, let the puppy get to know many people, sounds, surfaces and traffic in a calm way.'
