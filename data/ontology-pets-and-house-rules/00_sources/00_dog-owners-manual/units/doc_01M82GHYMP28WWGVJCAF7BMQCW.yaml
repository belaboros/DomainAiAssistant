  text: A puppy is a dog younger than 6 months. Puppies should not leave their mother before 8 weeks of age.
- content_hash: sha256:82d32dd8179a8204c33d5a56fd3f837daa86d55be6dfe775b48451459b2005ee
  document_id: doc_01M82GHYMP28WWGVJCAF7BMQCW
